<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniShare · PIM IT Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* โทนแบบ lnwshop: ขาวสะอาด ฟ้าสด เหลืองสดใส ปุ่มแคปซูล */
  --green:#00A859; --green-deep:#00793F; --green-soft:#E3F6EC; --sky:#00A4F1; --sky-soft:#E0F4FE;
  --teal:#10B981; --teal-soft:#E3FBF1;
  --amber:#FFD43B; --amber-soft:#FFF7D1;
  --red:#F43F5E; --red-soft:#FFE4E8;
  --blue:#7C3AED; --blue-soft:#F0E9FF;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F0F9FF; --line:#E8EEF4;
  --tint-sky:#F0F9FF; --tint-rose:#FFF1F2; --tint-mint:#ECFDF5; --tint-sun:#FFFBEA; --tint-grape:#F5F3FF;
  --ink:#111827; --ink-2:#374151; --ink-3:#9CA3AF;
  --hero:linear-gradient(115deg,#00793F 0%,#00A859 48%,#00B4D8 100%);
  --on-amber:#3B2A00;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px -14px rgba(0,121,63,.28);
  --radius:16px; --radius-sm:12px;
  --font:'Noto Sans Thai','Prompt',system-ui,sans-serif; --display:'Prompt',var(--font);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color-scheme:light;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green);text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);line-height:1.3;font-weight:600}
.page-head h1,.hero h1,.auth-art h1{font-weight:700}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:#FFFFFF;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{position:relative;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#00A859,#00793F);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 14px -6px rgba(0,121,63,.6);overflow:hidden}
.logo svg{width:24px;height:24px}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.logo .dot2{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.brand b{font-family:var(--display);font-size:19px;display:block;line-height:1.1}
.brand small{color:var(--ink-3);font-size:12px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--green-soft);color:var(--green-deep);font-weight:600}
.nav .sub{font-size:12px;color:var(--ink-3);font-weight:400;display:block;line-height:1.2}
.nav.on .sub{color:var(--green)}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--tint-sun);font-size:12.5px;color:var(--ink-2)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
.search input{border:0;background:none;outline:none;flex:1;color:var(--ink);min-width:0}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--surface)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-family:var(--display);flex:none;font-size:15px}
.me{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.me small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.1}
.content{padding:28px;max-width:1240px;width:100%;margin:0 auto;flex:1}
.bottom-nav{display:none}

/* components */
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:27px}
.page-head p{color:var(--ink-2);margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 18px;border-radius:999px;border:1px solid transparent;font-weight:500;cursor:pointer;white-space:nowrap;transition:.15s}
.btn-primary{background:var(--green);color:#fff;font-weight:600;box-shadow:0 6px 16px -8px var(--green)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-amber{background:var(--amber);color:var(--on-amber);font-weight:600}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:999px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip .n{font-size:11.5px;opacity:.7}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.t-green{background:var(--green-soft);color:var(--green-deep)}
.t-teal{background:var(--teal-soft);color:var(--teal)}
.t-amber{background:var(--amber-soft);color:#8A6100}
.t-red{background:var(--red-soft);color:var(--red)}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-gray{background:var(--surface-2);color:var(--ink-2)}
.muted{color:var(--ink-3);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3)}
.empty svg.i{width:40px;height:40px;stroke-width:1.3;margin-bottom:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.select,.input,.textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
.select:focus,.input:focus,.textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.textarea{min-height:90px;resize:vertical}
.toolbar .select{width:auto;min-width:150px}
label.f{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin:12px 0 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.seg button{padding:9px;border:0;border-radius:9px;background:none;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* stat */
.stat{padding:18px;border:0;box-shadow:none}
.grid.g4>.stat:nth-child(4n+1){background:var(--tint-sky)} .grid.g4>.stat:nth-child(4n+1) .k svg{color:#00A4F1}
.grid.g4>.stat:nth-child(4n+2){background:var(--tint-rose)} .grid.g4>.stat:nth-child(4n+2) .k svg{color:#F43F5E}
.grid.g4>.stat:nth-child(4n+3){background:var(--tint-mint)} .grid.g4>.stat:nth-child(4n+3) .k svg{color:#10B981}
.grid.g4>.stat:nth-child(4n+4){background:var(--tint-grape)} .grid.g4>.stat:nth-child(4n+4) .k svg{color:#7C3AED}
.stat .k{color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--display);font-size:30px;font-weight:600;margin-top:4px}
.stat .s{font-size:12.5px;color:var(--ink-2)}
.hero{padding:30px;border-radius:24px;background:var(--hero);color:#fff;position:relative;overflow:hidden;margin-bottom:20px}
.hero h1{font-size:28px}
.hero p{opacity:.85;margin-top:6px;max-width:560px}
.hero .blob{position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .blob2{position:absolute;right:120px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.ann{display:flex;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:10px;border:1px solid var(--line)}
.ann{border:0} .ann.info{background:var(--tint-grape)} .ann.warning{background:var(--tint-sun)} .ann.success{background:var(--tint-sky)}
.section-title{display:flex;align-items:center;margin:26px 0 12px}
.section-title h3{font-size:17px}

/* marketplace home */
.mkt-hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;padding:34px;border-radius:28px;background:var(--hero);color:#fff;overflow:hidden;margin-bottom:22px}
.mkt-hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;bottom:-220px;background:rgba(255,255,255,.12)}
.mkt-hero>div{min-width:0}
.mkt-search .btn{flex:none}
.mkt-hero .eyebrow{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:500}
.mkt-hero h1{font-size:40px;line-height:1.2;margin:14px 0 10px;text-wrap:balance}
.mkt-hero h1 em{font-style:normal;color:var(--amber)}
.mkt-hero p{opacity:.92;max-width:460px}
.mkt-search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 6px 6px 18px;max-width:520px;margin-top:20px;box-shadow:0 14px 30px -14px rgba(0,0,0,.35);color:var(--ink-3)}
.mkt-search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:15px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.quick button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.quick button:hover{background:rgba(255,255,255,.25)}
.collage{position:relative;min-height:270px;z-index:1}
.collage .pcard{position:absolute;width:168px;color:var(--ink);box-shadow:0 20px 40px -18px rgba(0,0,0,.45)}
.collage .pcard:nth-child(1){left:4%;top:24px;transform:rotate(-6deg)}
.collage .pcard:nth-child(2){left:36%;top:0;transform:rotate(3deg);z-index:2}
.collage .pcard:nth-child(3){left:64%;top:46px;transform:rotate(8deg)}
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:22px}
.cat{border:0;text-align:left;padding:16px;border-radius:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s}
.cat:hover{transform:translateY(-2px)}
.cat .ci{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center}
.cat .ci svg.i{width:22px;height:22px}
.cat b{font-family:var(--display);font-size:15px;font-weight:600}
.cat small{color:var(--ink-3);font-size:12.5px}
.promos{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
.promo{border-radius:24px;padding:24px;display:flex;align-items:center;gap:16px;cursor:pointer;position:relative;overflow:hidden}
.promo h3{font-size:22px;font-weight:700}
.promo p{color:var(--ink-2);font-size:14px;margin:4px 0 12px}
.promo .big{margin-left:auto;font-family:var(--display);font-size:54px;font-weight:700;line-height:1;opacity:.9}
.mkt-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;scroll-snap-align:start;transition:.18s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard .im{aspect-ratio:1/1;background:var(--tint-sky);position:relative;overflow:hidden}
.pcard .im img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .im .pill{position:absolute;left:10px;top:10px}
.pcard .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.pcard .nm{font-weight:500;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pcard .pr{font-family:var(--display);font-weight:700;font-size:18px;color:var(--green-deep)}
.pcard .pr.free{color:var(--sky)}
.pcard .who{font-size:12px;color:var(--ink-3)}
.pill-free{background:var(--green);color:#fff;font-weight:600}
.pill-sale{background:var(--amber);color:var(--on-amber);font-weight:600}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 4px}
.trust div{display:flex;gap:10px;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.trust b{display:block;color:var(--ink);font-family:var(--display);font-size:18px}
.trust svg.i{color:var(--green);width:22px;height:22px}
@media (max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}.trust{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.mkt-hero{grid-template-columns:1fr;padding:22px}.mkt-search{padding-left:14px}.mkt-search .btn{padding:8px 14px}.mkt-hero h1{font-size:29px}.collage{display:none}.promos{grid-template-columns:1fr}.promo .big{font-size:40px}}
/* note card */
.note{padding:16px;display:flex;flex-direction:column;gap:10px}
.file-ico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;flex:none;letter-spacing:.03em}
.note h4{font-size:15.5px;font-weight:600}
.note .meta{display:flex;gap:12px;color:var(--ink-3);font-size:12.5px;flex-wrap:wrap}
.note .foot{display:flex;gap:6px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
/* item card */
.item{overflow:hidden;display:flex;flex-direction:column}
.item .ph{aspect-ratio:4/3;background:var(--surface-2);position:relative;display:grid;place-items:center;color:var(--ink-3)}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .ph .badge{position:absolute;top:10px;left:10px;box-shadow:0 1px 4px rgba(0,0,0,.15);background:var(--surface)}
.item .ph .st{position:absolute;top:10px;right:10px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.item .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font-family:var(--display);font-size:20px;font-weight:700;color:var(--green-deep)}
.price.free{color:var(--teal)}
.item.sold .ph img{filter:grayscale(1) opacity(.6)}
/* thread */
.thread{padding:16px 18px;display:flex;gap:14px;cursor:pointer;transition:.15s}
.thread:hover{border-color:var(--green)}
.thread h4{font-size:16px;font-weight:600}
.thread .ex{color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.replies-count{text-align:center;min-width:54px;padding:6px;border-radius:10px;background:var(--surface-2);height:fit-content}
.replies-count b{display:block;font-family:var(--display);font-size:18px}
.replies-count small{font-size:11px;color:var(--ink-3)}
.reply{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.reply .bubble{flex:1;min-width:0}
.attach{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);max-width:420px}
.attach img{max-width:100%;max-height:260px;border-radius:8px;display:block}
.composer{padding:14px;margin-top:16px}
.composer .pending{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--green-soft);font-size:13px}
/* review */
.stars{display:inline-flex;gap:2px;color:var(--amber)}
.stars svg.i{width:16px;height:16px}
.stars svg.i.full{fill:currentColor}
.star-input{display:flex;gap:4px}
.star-input button{background:none;border:0;cursor:pointer;color:var(--line);padding:2px}
.star-input button.on{color:var(--amber)}
.star-input svg.i{width:30px;height:30px;fill:currentColor;stroke-width:1}
.review{padding:18px}
/* video */
.video{overflow:hidden;cursor:pointer}
.video .thumb{aspect-ratio:16/9;background:#111 center/cover no-repeat;position:relative;display:grid;place-items:center}
.video .play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#111;transition:.2s}
.video:hover .play{transform:scale(1.08)}
.video .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:2px 7px;border-radius:6px}
.video .src{position:absolute;left:8px;top:8px}
.video .body{padding:12px 14px}
/* table */
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--green-deep);border-color:var(--green)}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--green);min-height:3px}
.bars .b small{font-size:11px;color:var(--ink-3)}
.bars .b em{font-style:normal;font-size:11.5px;color:var(--ink-2)}
.hbar{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr 34px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.hbar .track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--teal);border-radius:6px}
/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,23,20,.5);display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .18s}
.modal.wide{max-width:860px}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h3{font-size:18px}
.modal-body{padding:6px 22px 22px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--ink-3);background:var(--surface-2)}
.drop:hover{border-color:var(--green);color:var(--green)}
.drop img{max-height:180px;border-radius:9px;margin:0 auto 8px;display:block}
.panel{position:fixed;top:70px;right:20px;width:380px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;z-index:40;animation:pop .15s}
.notif{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:color-mix(in srgb,var(--green-soft) 60%,transparent)}
.notif .nd{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:7px;flex:none}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:11px 18px;border-radius:12px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);font-size:14px;animation:pop .2s;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--red);color:#fff}
.demo-bar{background:var(--amber);color:var(--on-amber);font-weight:500;font-size:13px;padding:7px 28px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{background:var(--hero);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art h1{font-size:40px;max-width:460px}
.auth-art p{opacity:.85;max-width:440px;margin-top:12px;font-size:16px}
.auth-art .feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px;margin-top:32px}
.auth-art .feat div{padding:14px;border-radius:14px;background:rgba(255,255,255,.1);font-size:13.5px;display:flex;gap:10px;align-items:center}
.auth-form{display:grid;place-items:center;padding:32px;background:#FFFFFF}
.auth-form .box{width:100%;max-width:400px}
.auth-form h2{font-size:26px;margin-bottom:6px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12.5px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 16px}
  .content{padding:18px 16px 96px}
  .me .nm{display:none}.me{padding:3px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);padding:4px 0;cursor:pointer}
  .bottom-nav button.on{color:var(--green)}
  .auth{grid-template-columns:1fr}.auth-art{padding:28px}.auth-art h1{font-size:28px}.auth-art .feat{display:none}
  .page-head h1{font-size:23px}
  .demo-bar{padding:7px 16px}
  .hbar{grid-template-columns:100px 1fr 28px}
}
@media (max-width:820px){
  .search{min-width:0}
  .top-actions{gap:6px;flex:none}
  .top-actions .theme-btn{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-left:-16px;margin-right:-16px;padding:0 16px 4px;scrollbar-width:none}
  .chips .chip{flex:none}
  .page-head .actions{margin-left:0}
  .toolbar .search{max-width:none!important;flex:1 1 100%}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.brand-top{display:none}.search{max-width:none}}

    if (/pim\.ac\.th|Database error saving new user/i.test(m)) return 'ต้องใช้อีเมลสถาบัน @pim.ac.th เท่านั้น';
    if (/Invalid login credentials/i.test(m)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
    if (/Email not confirmed/i.test(m)) return 'ยังไม่ได้ยืนยันอีเมล กรุณากดลิงก์ยืนยันในอีเมลของคุณ (หรือกด "ส่งอีเมลยืนยันอีกครั้ง")';
    if (/already registered|already been registered/i.test(m)) return 'อีเมลนี้ลงทะเบียนแล้ว';
    if (/rate limit|security purposes|too many/i.test(m)) return 'ส่งคำขอบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่';
    if (/Password should be at least/i.test(m)) return 'รหัสผ่านอย่างน้อย 6 ตัวอักษร';
    if (/row-level security|permission denied/i.test(m)) return 'คุณไม่มีสิทธิ์ทำรายการนี้ (บัญชีอาจถูกระงับ หรือกระทู้ถูกล็อก)';

  async function handle(method, url, body) {
    const [path, qstr] = url.split('?'); const qy = Object.fromEntries(new URLSearchParams(qstr || ''));
    for (const [m, re, fn] of routes) {
      const mt = path.match(re); if (m !== method || !mt) continue;
      if (!/\/api\/(health|subjects|announcements)$/.test(path) && !me) { await loadMe(); if (!me) throw err(401, 'กรุณาเข้าสู่ระบบ'); }
      if (me && me.is_banned) throw err(403, 'บัญชีนี้ถูกระงับการใช้งาน');
      if (/\/api\/admin\//.test(path) && !isAdm()) throw err(403, 'สำหรับผู้ดูแลระบบเท่านั้น');
      return fn(body || {}, qy, mt);
    }
    throw err(404, 'ไม่พบ endpoint');
  }

  // ---- auth
  async function afterSignIn() {
    const u = await loadMe();
    if (!u) throw err(401, 'ไม่พบโปรไฟล์ผู้ใช้');
    if (u.is_banned) { await client().auth.signOut(); me = null; throw err(403, 'บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); }
    try { await client().rpc('touch_login'); } catch { }
    return { token: 'sb', user: u };
  }
  async function login(email, password) {
    const { error } = await client().auth.signInWithPassword({ email, password });
    if (error) throw err(401, thai(error.message));
    return afterSignIn();
  }
  async function register({ email, password, display_name, year }) {
    const { data, error } = await client().auth.signUp({ email, password, options: { data: { display_name, year }, emailRedirectTo: location.origin + location.pathname } });
    if (error) throw err(400, thai(error.message));
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw err(409, 'อีเมลนี้ลงทะเบียนแล้ว');
    if (data.session) return afterSignIn();
    return { needsConfirm: true, email };
  }
  async function resend(email) { const { error } = await client().auth.resend({ type: 'signup', email, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) throw err(400, thai(error.message)); }
  async function forgot(email) { const { error } = await client().auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) throw err(400, thai(error.message)); }
  async function setPassword(password) { const { error } = await client().auth.updateUser({ password }); if (error) throw err(400, thai(error.message)); }
  async function logout() { me = null; try { await client().auth.signOut(); } catch { } }
  function onAuth(cb) { client().auth.onAuthStateChange((event) => cb(event)); }
  return { handle, login, register, resend, forgot, setPassword, logout, loadMe, afterSignIn, onAuth, enabled: () => !!(SB_CFG.url && SB_CFG.key && window.supabase) };
})();

/* =========================================================
   API layer + state
   ========================================================= */
const state = {
  mode: 'demo', token: store.getItem('us_token') || '', user: null,
  view: 'home', params: {}, loading: false, data: {}, subjects: [], anns: [], notifs: [],
  f: { notes: { q: '', subject: '', sort: 'new' }, items: { q: '', type: '', status: '', category: '' }, threads: { q: '', tag: '' }, reviews: { q: '', sort: 'new' }, videos: { q: '', subject: '' } },
  admin: { tab: 'overview', ctype: 'note', q: '', rstatus: 'OPEN' },
  panel: false,
};
async function api(method, path, body) {
  if (state.mode === 'demo') return Mock.handle(method, path, body, state.token);
  if (state.mode === 'live') return SB.handle(method, path, body);
  const res = await fetch(CONFIG.API_BASE + path, {
    method, headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null; try { data = await res.json(); } catch { }
  if (!res.ok) {
    let msg = data?.detail; if (Array.isArray(msg)) msg = msg.map(d => d.msg).join(', ');
    const e = new Error(msg || 'เกิดข้อผิดพลาด (' + res.status + ')'); e.status = res.status; throw e;
  }
  return data;
}
const qs = o => { const p = new URLSearchParams(Object.entries(o).filter(([, v]) => v !== '' && v != null)).toString(); return p ? '?' + p : ''; };
async function detectMode() {
  if (SB.enabled()) return 'live';
  if (!CONFIG.API_BASE) return 'demo';

}
async function safe(fn, okMsg) {

function go(view, params = {}) {
  const h = '#' + view + (params.id ? '-' + params.id : '');
  if (location.hash !== h) location.hash = h; else route();
}
async function route() {
  const [view = 'home', id] = location.hash.replace(/^#\/?/, '').split(/[-/]/);
  state.view = (view === 'thread' && id) ? 'thread' : ([...NAV.map(n => n.id), 'admin', 'profile'].includes(view) ? view : 'home');
  if (state.view === 'admin' && !isAdmin()) state.view = 'home';
  state.params = id ? { id: +id } : {};
  state.panel = false;
  await loadView(); render(); window.scrollTo({ top: 0 });
}
async function loadView() {
  if (!state.user) return;
  const v = state.view, f = state.f[v];
  if (v === 'admin' || v === 'thread') state.data[v] = null; // shape changes per tab / per thread
  state.loading = true; render();
  try {
    const jobs = { home: async () => { const [ov, items] = await Promise.all([api('GET', '/api/overview'), api('GET', '/api/items')]); return { ...ov, items }; }, notes: () => api('GET', '/api/notes' + qs(f)), items: () => api('GET', '/api/items' + qs(f)),
      threads: () => api('GET', '/api/threads' + qs(f)), thread: () => api('GET', '/api/threads/' + state.params.id), reviews: () => api('GET', '/api/reviews' + qs(f)),
      videos: () => api('GET', '/api/videos' + qs(f)), admin: () => loadAdmin(), profile: () => Promise.resolve(null) };
    const [d] = await Promise.all([jobs[v](), refreshMeta()]);
    state.data[v] = d;
  } catch (e) { if (e.status === 401) return logout(true); toast(e.message, true); if (v === 'thread') return go('threads'); }
  finally { state.loading = false; }
}
async function refreshMeta() {
  const [s, a, n] = await Promise.all([api('GET', '/api/subjects'), api('GET', '/api/announcements'), api('GET', '/api/notifications')]);
  state.subjects = s; state.anns = a; state.notifs = n;
}

function setFilter(view, key, val) { state.f[view][key] = val; clearTimeout(searchTimer); searchTimer = setTimeout(reload, key === 'q' ? 300 : 0); }
function globalSearch(val) {

  state.f[target].q = val; clearTimeout(searchTimer);

async function doLogin(ev) {
  ev.preventDefault(); const f = ev.target, er = $('#auth-err'); er.textContent = '';
  const email = f.email.value.trim().toLowerCase();
  if (authTab === 'register' && !email.endsWith(CONFIG.DOMAIN)) { er.textContent = `กรุณาใช้อีเมลสถาบัน (${CONFIG.DOMAIN}) เท่านั้น`; return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    let r;
    if (state.mode === 'live') {
      r = authTab === 'login' ? await SB.login(email, f.password.value)
        : await SB.register({ email, password: f.password.value, display_name: f.display_name.value.trim(), year: +f.year.value });
      if (r.needsConfirm) { pendingEmail = email; authTab = 'confirm'; render(); return; }
    } else {
      r = authTab === 'login' ? await api('POST', '/api/auth/login', { email, password: f.password.value })
        : await api('POST', '/api/auth/register', { email, password: f.password.value, display_name: f.display_name.value, year: +f.year.value });
    }
    setSession(r); toast('ยินดีต้อนรับ ' + r.user.display_name); route();
  } catch (e) { er.textContent = e.message; if (/ยืนยันอีเมล/.test(e.message)) { pendingEmail = email; er.innerHTML += ` <a href="javascript:resendConfirm()">ส่งอีเมลยืนยันอีกครั้ง</a>`; } } finally { btn.disabled = false; }
}

   ========================================================= */
function openModal(title, body, { wide = false, onSubmit } = {}) {
  closeModal();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'modal';
  o.innerHTML = `<form class="modal ${wide ? 'wide' : ''}" onclick="event.stopPropagation()"><div class="modal-head"><h3>${title}</h3><span class="spacer"></span><button type="button" class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
    <div class="modal-body">${body}</div>${onSubmit ? `<div class="modal-foot"><div class="err" id="m-err" style="margin:0 auto 0 0;align-self:center"></div><button type="button" class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="m-submit">บันทึก</button></div>` : ''}</form>`;
  o.addEventListener('click', closeModal);
  const form = o.querySelector('form');
  form.addEventListener('submit', async e => {
    e.preventDefault(); if (!onSubmit) return;
    const btn = $('#m-submit'); btn.disabled = true; $('#m-err').textContent = '';
    try { await onSubmit(form); closeModal(); } catch (er) { $('#m-err').textContent = er.message; } finally { btn.disabled = false; }
  });
  document.body.appendChild(o); setTimeout(() => o.querySelector('input,textarea,select')?.focus(), 50);
  return form;
}
function closeModal() { $('#modal')?.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmBox(title, text, onYes) {
  const f = openModal(title, `<p style="padding:14px 0;color:var(--ink-2)">${esc(text || 'ยืนยันการดำเนินการนี้หรือไม่?')}</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button type="button" class="btn btn-danger" id="yes">ยืนยัน</button></div>`);
  f.querySelector('#yes').onclick = async () => { closeModal(); try { await onYes(); } catch { } };
}
function fileDrop(name, accept, label) {
  return `<label class="drop" id="drop-${name}">${ic('cloud')}<div id="drop-${name}-t">${label}</div><input type="file" name="${name}" accept="${accept}" hidden onchange="dropPicked(this)"></label>`;
}
async function dropPicked(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    const url = await readFile(f); inp.dataset.url = url; inp.dataset.name = f.name; inp.dataset.size = f.size;
    $('#drop-' + inp.name + '-t').innerHTML = (url.startsWith('data:image') ? `<img src="${url}">` : fileIcon(f.name)) + `<div><b>${esc(f.name)}</b> · ${fmtSize(f.size)}</div>`;
  } catch (e) { inp.value = ''; toast(e.message, true); }
}

function openNoteForm() {
  openModal('อัปโหลดเอกสาร', `
    <label class="f">หัวข้อเอกสาร</label><input class="input" name="title" required maxlength="255" placeholder="เช่น สรุปบทที่ 3 Normalization">
    <div class="grid g2" style="gap:10px"><div><label class="f">รายวิชา</label><select class="select" name="subject_name" required>${state.subjects.map(s => `<option ${state.f.notes.subject === s.name ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div><label class="f">ประเภท</label><select class="select" name="note_type">${NOTE_TYPES.map(t => `<option>${t}</option>`).join('')}</select></div></div>
    <div class="grid g2" style="gap:10px"><div><label class="f">สาขาวิชา</label><input class="input" value="${CONFIG.DEPARTMENT}" disabled></div><div><label class="f">ผู้อัปโหลด</label><input class="input" value="${esc(state.user.display_name)}" disabled></div></div>
    <label class="f">คำอธิบาย (ไม่บังคับ)</label><textarea class="textarea" name="description" style="min-height:60px"></textarea>
    <label class="f">ไฟล์ (PDF, DOCX, PPTX, ZIP)</label>${fileDrop('file', '.pdf,.doc,.docx,.ppt,.pptx,.zip,.txt', 'คลิกเพื่อเลือกไฟล์ · สูงสุด 10MB')}`,
    { onSubmit: async f => {
      const inp = f.file; if (!inp.dataset.url) throw new Error('กรุณาเลือกไฟล์');
      await safe(() => api('POST', '/api/notes', { title: f.title.value, subject_name: f.subject_name.value, note_type: f.note_type.value, description: f.description.value, file_name: inp.dataset.name, file_size: +inp.dataset.size, file_data: inp.dataset.url }), 'อัปโหลดเอกสารแล้ว');

async function downloadNote(id) { const n = await safe(() => api('GET', `/api/notes/${id}/download`)); downloadDataUrl(n.file_data, n.file_name); toast('เริ่มดาวน์โหลด ' + n.file_name); reload(); }

function openItemForm() {
  const f = openModal('ลงประกาศส่งต่อสิ่งของ', `
    <label class="f">รูปแบบการส่งต่อ</label><div class="seg" id="seg-type"><button type="button" class="on" data-v="FREE">🎁 แจกฟรี</button><button type="button" data-v="FOR_SALE">🏷️ ซื้อ-ขาย</button></div><input type="hidden" name="sharing_type" value="FREE">
    <label class="f">ชื่อสิ่งของ</label><input class="input" name="name" required maxlength="255" placeholder="เช่น หนังสือ Java เบื้องต้น">

      <div><label class="f">สภาพ</label><select class="select" name="item_condition">${ITEM_COND.map(c => `<option>${c}</option>`).join('')}</select></div></div>
    <label class="f">รายละเอียด</label><textarea class="textarea" name="description" style="min-height:60px"></textarea>
    <label class="f">ช่องทางติดต่อ (แสดงให้ผู้จองเห็นเท่านั้น)</label><input class="input" name="contact" placeholder="เช่น LINE: myid">
    <label class="f">รูปภาพ</label>${fileDrop('image', 'image/*', 'คลิกเพื่อเลือกรูปภาพ')}`,
    { onSubmit: async f => {

  });

async function itemAction(id, action) {
  closeModal();
  const msg = { reserve: 'ส่งคำขอแล้ว เจ้าของจะได้รับแจ้งเตือน', cancel: 'ยกเลิกการจองแล้ว', sold: 'อัปเดตสถานะแล้ว', available: 'เปิดประกาศอีกครั้งแล้ว' }[action];
  await safe(() => api('PATCH', `/api/items/${id}/status`, { action }), msg); reload();
}

function openThreadForm() {
  openModal('ตั้งกระทู้ใหม่', `<label class="f">หัวข้อ</label><input class="input" name="title" required maxlength="255">
    <label class="f">หมวดหมู่</label><select class="select" name="tag">${THREAD_TAGS.map(t => `<option>${t}</option>`).join('')}</select>
    <label class="f">รายละเอียด</label><textarea class="textarea" name="body" style="min-height:120px"></textarea>`,
    { onSubmit: async f => { const t = await safe(() => api('POST', '/api/threads', { title: f.title.value, tag: f.tag.value, body: f.body.value }), 'ตั้งกระทู้แล้ว'); go('thread', { id: t.thread_id }); } });
}
async function pickAttach(inp) {
  const f = inp.files[0]; if (!f) return;
  try { pendingAttach = { url: await readFile(f), name: f.name, size: f.size };
    $('#reply-pending').innerHTML = `<div class="pending">${ic('clip')}<b>${esc(f.name)}</b><span class="muted">${fmtSize(f.size)}</span><span class="spacer"></span><button type="button" class="btn btn-ghost btn-sm" onclick="pendingAttach=null;$('#reply-pending').innerHTML=''">${ic('x')}</button></div>`;
  } catch (e) { toast(e.message, true); } inp.value = '';
}
async function sendReply(id) {
  const text = $('#reply-text').value.trim(); if (!text && !pendingAttach) return toast('กรุณาพิมพ์ข้อความหรือแนบไฟล์', true);
  $('#reply-btn').disabled = true;
  try { await safe(() => api('POST', `/api/threads/${id}/replies`, { reply_text: text, attachment_url: pendingAttach?.url || '', attachment_name: pendingAttach?.name || '' }), 'ส่งความคิดเห็นแล้ว'); pendingAttach = null; reload(); }
  catch { $('#reply-btn').disabled = false; }
}

function openReviewForm() {
  const f = openModal('เขียนรีวิวสื่อการเรียน', `<label class="f">ชื่อสื่อการเรียน</label><input class="input" name="media_name" required maxlength="255" placeholder="เช่น หนังสือ Clean Code">
    <label class="f">ประเภท</label><select class="select" name="media_type">${MEDIA_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
    <label class="f">คะแนน</label><div class="star-input" id="star-input">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-v="${i}" class="${i <= 5 ? 'on' : ''}">${ic('star')}</button>`).join('')}</div><input type="hidden" name="rating" value="5">
    <label class="f">รีวิว</label><textarea class="textarea" name="content" required placeholder="ข้อดี ข้อเสีย เหมาะกับใคร"></textarea>`,
    { onSubmit: async f => { await safe(() => api('POST', '/api/reviews', { media_name: f.media_name.value, media_type: f.media_type.value, rating: +f.rating.value, content: f.content.value }), 'โพสต์รีวิวแล้ว'); state.view === 'reviews' ? reload() : go('reviews'); } });
  const btns = f.querySelectorAll('#star-input button');
  const paint = v => btns.forEach(b => b.classList.toggle('on', +b.dataset.v <= v));
  btns.forEach(b => { b.onclick = () => { f.rating.value = b.dataset.v; paint(+b.dataset.v); }; b.onmouseenter = () => paint(+b.dataset.v); });
  $('#star-input').onmouseleave = () => paint(+f.rating.value);
}
async function helpful(id) { await safe(() => api('POST', `/api/reviews/${id}/helpful`)); reload(); }

function openVideoForm() {
  const f = openModal('เพิ่มคลิปการเรียน', `<label class="f">ชื่อคลิป</label><input class="input" name="title" required maxlength="255">
    <label class="f">แหล่งที่มา</label><div class="seg" id="seg-src"><button type="button" class="on" data-v="url">ลิงก์ YouTube / Drive</button><button type="button" data-v="file">อัปโหลดไฟล์</button></div>
    <div id="src-url"><label class="f">URL</label><input class="input" name="url" placeholder="https://www.youtube.com/watch?v=..."></div>
    <div id="src-file" style="display:none"><label class="f">ไฟล์วิดีโอ (ไม่เกิน 10MB)</label>${fileDrop('vfile', 'video/*', 'คลิกเพื่อเลือกไฟล์วิดีโอ')}</div>
    <div class="grid g2" style="gap:10px"><div><label class="f">รายวิชา</label><select class="select" name="subject_name"><option value="">- ไม่ระบุ -</option>${state.subjects.map(s => `<option>${esc(s.name)}</option>`).join('')}</select></div>
      <div><label class="f">ความยาว</label><input class="input" name="duration" placeholder="เช่น 15:30"></div></div>`,
    { onSubmit: async f => {
      const url = f.vfile.dataset.url && $('#src-file').style.display !== 'none' ? f.vfile.dataset.url : f.url.value.trim();
      if (!url) throw new Error('กรุณาใส่ลิงก์หรือเลือกไฟล์');
      await safe(() => api('POST', '/api/videos', { title: f.title.value, url, subject_name: f.subject_name.value, duration: f.duration.value }), 'เพิ่มคลิปแล้ว'); state.view === 'videos' ? reload() : go('videos');
    } });
  f.querySelectorAll('#seg-src button').forEach(b => b.onclick = () => { f.querySelectorAll('#seg-src button').forEach(x => x.classList.toggle('on', x === b)); $('#src-url').style.display = b.dataset.v === 'url' ? '' : 'none'; $('#src-file').style.display = b.dataset.v === 'file' ? '' : 'none'; });
}
async function playVideo(id) {
  const v = await safe(() => api('POST', `/api/videos/${id}/view`)); const vi = videoInfo(v.url);
  const player = vi.embed ? `<div style="aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin-top:14px"><iframe src="${esc(vi.embed)}" style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>`
    : vi.file ? `<video src="${esc(vi.file)}" controls autoplay style="width:100%;border-radius:12px;margin-top:14px;background:#000"></video>`
    : `<p style="padding:20px 0">ลิงก์นี้เล่นในหน้าไม่ได้ <a href="${esc(vi.link)}" target="_blank" rel="noopener">เปิดในแท็บใหม่ →</a></p>`;
  openModal(esc(v.title), player + `<div class="muted" style="margin-top:10px">${esc(v.uploader)} · ${fmtNum(v.views)} ครั้ง${v.subject_name ? ' · ' + esc(v.subject_name) : ''}</div>`, { wide: true });
  if (state.view === 'videos') { const d = state.data.videos.find(x => x.video_id === id); if (d) d.views = v.views; }
}

function openReport(type, id) {
  openModal('รายงานเนื้อหาไม่เหมาะสม', `<label class="f">เหตุผล</label><select class="select" name="preset"><option>สแปม / โฆษณา</option><option>เนื้อหาไม่เหมาะสม</option><option>ละเมิดลิขสิทธิ์</option><option>ข้อมูลเท็จ / หลอกลวง</option><option>อื่นๆ</option></select>
    <label class="f">รายละเอียดเพิ่มเติม</label><textarea class="textarea" name="detail" style="min-height:70px"></textarea>`,
    { onSubmit: async f => { await safe(() => api('POST', '/api/reports', { target_type: type, target_id: id, reason: f.preset.value + (f.detail.value ? ': ' + f.detail.value : '') }), 'ส่งรายงานถึงผู้ดูแลแล้ว ขอบคุณครับ'); } });
}
const DEL = { note: ['/api/notes/', 'ลบเอกสารนี้?'], item: ['/api/items/', 'ลบประกาศนี้?'], thread: ['/api/threads/', 'ลบกระทู้นี้และความคิดเห็นทั้งหมด?'], reply: ['/api/replies/', 'ลบความคิดเห็นนี้?'], review: ['/api/reviews/', 'ลบรีวิวนี้?'], video: ['/api/videos/', 'ลบคลิปนี้?'] };
function del(type, id) {
  const [path, title] = DEL[type];
  confirmBox(title, 'การลบไม่สามารถย้อนกลับได้', async () => {
    await safe(() => api('DELETE', path + id), 'ลบเรียบร้อยแล้ว');
    if (type === 'thread') go('threads'); else reload();
  });
}
async function saveProfile(e) { e.preventDefault(); const f = e.target; state.user = await safe(() => api('PATCH', '/api/auth/me', { display_name: f.display_name.value, year: +f.year.value }), 'บันทึกโปรไฟล์แล้ว'); render(); }
function resetDemo() { confirmBox('รีเซ็ตข้อมูลสาธิต?', 'ข้อมูลที่สร้างในเบราว์เซอร์นี้จะหายทั้งหมด', () => { Mock.reset(); logout(); toast('รีเซ็ตแล้ว'); }); }
function openSettings() {
  openModal('ตั้งค่าการเชื่อมต่อ API', `<p class="muted" style="margin-top:12px">ใส่ URL ของ FastAPI backend (เช่น https://unishare-api.onrender.com หรือ http://localhost:8000) เว้นว่างเพื่อใช้โหมดสาธิต</p>
    <label class="f">API Base URL</label><input class="input" name="api" value="${esc(CONFIG.API_BASE)}" placeholder="http://localhost:8000">
    <p class="muted" style="margin-top:10px">สถานะตอนนี้: <b>${state.mode === 'live' ? 'เชื่อมต่อแล้ว' : 'โหมดสาธิต'}</b></p>`,
    { onSubmit: async f => { const v = f.api.value.trim().replace(/\/$/, ''); store.setItem('us_api', v); CONFIG.API_BASE = v; store.removeItem('us_token'); state.token = ''; state.user = null; await boot(); toast(state.mode === 'live' ? 'เชื่อมต่อ API สำเร็จ' : 'เชื่อมต่อไม่ได้ ใช้โหมดสาธิต', state.mode !== 'live' && !!v); } });
}

/* ---------- theme ---------- */
function isDark() { return false; }
function toggleTheme() { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.setItem('us_theme', t); render(); }

/* ---------- boot ---------- */
async function boot() {
  document.documentElement.dataset.theme = 'light';
  $('#root').innerHTML = '<div class="empty" style="padding-top:30vh">กำลังเชื่อมต่อ...</div>';
  state.mode = await detectMode();
  if (state.mode === 'live') {
    SB.onAuth(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(openNewPassword, 300); });
    if (/type=(recovery|signup)|access_token=/.test(location.hash)) await new Promise(r => setTimeout(r, 600));
    try { const u = await SB.loadMe(); if (u && !u.is_banned) { state.token = 'sb'; state.user = u; } else state.token = ''; } catch { state.token = ''; }
    if (/access_token=|type=/.test(location.hash)) history.replaceState(null, '', location.pathname + '#home');
    if (state.user) { await route(); toast('ยินดีต้อนรับ ' + state.user.display_name); } else render();
    return;
  }
  if (state.mode === 'demo' && state.token && !state.token.startsWith('demo.')) state.token = '';
  if (state.mode === 'live' && state.token.startsWith('demo.')) state.token = '';
  if (state.token) { try { state.user = await api('GET', '/api/auth/me'); } catch { state.token = ''; store.removeItem('us_token'); } }
  if (state.user) await route(); else render();
}
window.addEventListener('hashchange', () => { if (state.user) route(); });
setInterval(async () => { if (state.user && document.visibilityState === 'visible') { try { const n = await api('GET', '/api/notifications'); const changed = n.filter(x => !x.is_read).length !== state.notifs.filter(x => !x.is_read).length; state.notifs = n; if (changed && !$('#modal') && document.activeElement?.tagName !== 'TEXTAREA' && document.activeElement?.tagName !== 'INPUT') render(); } catch { } } }, 20000);
boot();
</script>
